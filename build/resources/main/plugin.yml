name: WatchParty
version: ${version}
main: club.mineclub.watchparty.WatchPartyPlugin
api-version: '1.21'
description: Streams live video onto in-game map/item-frame screens via packets.
author: WMWI
depend:
  - ProtocolLib

commands:
  videoscreen:
    description: Create, manage and stream to virtual video screens.
    usage: |
      /videoscreen create <name> <width> <height>
      /videoscreen start  <name> <rtmp-url>
      /videoscreen stop   <name>
      /videoscreen delete <name>
      /videoscreen list
    permission: videoscreen.admin
    aliases:
      - vs

permissions:
  videoscreen.admin:
    description: Allows full management of video screens.
    default: op
