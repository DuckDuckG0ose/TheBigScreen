# WatchParty Configuration
# ────────────────────────────────────────────────────────────────────────────
# All options can be reloaded at runtime in a future version; for now restart
# the server after editing.

# ── Map ID allocation ────────────────────────────────────────────────────────
# Virtual (fake) map IDs are allocated starting from this value.
# These IDs are never written to disk; they exist only in packets.
# On plugin enable, a warning is logged if any real map_<id>.dat file in the
# default world already uses an ID inside [fakeMapIdStart, fakeMapIdStart + 9999].
# Raise this value if your world has many existing maps.
fakeMapIdStart: 10000

# ── Video decoding ────────────────────────────────────────────────────────────
# Target frames per second for the decode→convert→send pipeline.
# The pipeline drops frames to maintain real-time cadence when decoding is slow.
# Valid range: 1–30. Recommended: 10–20.
targetFps: 15

# Maximum number of decoded frames buffered between pipeline stages.
# A smaller value reduces latency; a larger value smooths burst delays.
maxQueueDepth: 2

# ── RTMP reconnect ────────────────────────────────────────────────────────────
# Number of times to retry connecting to an RTMP stream before giving up.
reconnectAttempts: 5
# Milliseconds to wait between reconnect attempts.
reconnectDelayMs: 3000

# ── Rendering ────────────────────────────────────────────────────────────────
# Build the 16 MB RGB→palette look-up table during plugin enable.
# Set to false to defer LUT build until the first screen starts (adds ~400ms
# to the first frame conversion).
lutBuildOnStartup: true

# ── Delivery ─────────────────────────────────────────────────────────────────
# Default render distance: players further than this many blocks from the
# screen anchor will NOT receive map update packets.
# Can be overridden per screen in the future.
renderRadiusBlocks: 64

# Hide the item frame border/background so only the video is visible.
# Sends EntityMetadata to set the item frame as "invisible".
hideFrameBorder: true

# ── Placeholder Image ────────────────────────────────────────────────────────
# Relative path (inside the plugin's folder) or absolute path to a PNG/JPG image.
# If configured, this image will display on the screen when no video is playing
# (instead of a blank black screen).
# Example: "placeholder.png"
placeholderImage: ""

